<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UFT-8">
        <title>게임 이벤트 일람</title>
    </head>
    <body>
        <!-- UX 계획
        사용자 : 게임의 이벤트 기간을 놓치는 플레이어
        목적 : 게임의 이벤트 기간을 한 눈에 확인한다.
        핵심 행동 : 원하는 영역으로 이동하고 이벤트를 확인한다.
        정보 순서 :  소개 > 주요 기능 > 이용 방법 > 마감 알림 받기 -->
        <header>
            <h1>게임 이벤트 일람</h1>
            <p>이벤트를 한 눈에 확인이 가능하다.</p>

            <nav aria-label="주요 메뉴">
                <a href="#about">서비스 소개</a>
                <a href="#features">기능 소개</a>
                <a href="#steps">이용 방법</a>
                <a href="#subscribe">소식 받기</a>
            </nav>
        </header>

        <main>
            <section id="about">
                <h2>서비스 소개</h2>
                <h3>게임 이벤트 확인 하기</h3>
                <img src="assets/images/proseka.webp" alt="프로세카">
            </section>

            <section id="features">
                <h2>게임들의 이벤트 보기 기능 소개</h2>
                <ul>
                    <li>
                        <h3>진행중인 이벤트</h3>
                        <p>진쟁중인 이벤트 확인이 가능합니다.</p>
                    </li>
                    <li>
                        <h3>진행 예정 이벤트</h3>
                        <p>진쟁 예정인 이벤트 확인이 가능합니다.</p>
                    </li>
                    <li>
                        <h3>종료된 이벤트</h3>
                        <p>종료된 이벤트 확인이 가능합니다.</p>
                    </li>
                </ul>
            </section>

            <section id="steps">
                <h2> 이용 방법 </h2>
                <ol>
                    <li>회원가입 및 로그인</li>
                    <li>원하는 게임 선택</li>
                    <li>진행중인 이벤트 확인</li>
                </ol>
            </section>

            <section id="subscribe">
                <h2>소식 받기</h2>
                <form>
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email">
                    <button type="submit">소식 받기</button>
                </form>
            </section>
        </main>

        <footer>
            <small>©게임 이벤트 일람</small>
        </footer>
    </body>
</html>
